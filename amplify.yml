version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm install

    build:
      commands:
        - env | grep -e SMTP_HOST >> .env.production
        - env | grep -e SMTP_PORT >> .env.production
        - env | grep -e SMTP_SECURE >> .env.production
        - env | grep -e SMTP_USER >> .env.production
        - env | grep -e SMTP_PASS >> .env.production
        - env | grep -e CONTACT_EMAIL >> .env.production
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*