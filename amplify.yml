version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci

    build:
      commands:
        - env | grep -e SMTP_HOST >> .env.production
        - env | grep -e SMTP_PORT >> .env.production
        - env | grep -e SMTP_SECURE >> .env.production
        - env | grep -e SMTP_USER >> .env.production
        - env | grep -e SMTP_PASS >> .env.production
        - env | grep -e CONTACT_EMAIL >> .env.production
        - env | grep -e NEXT_PUBLIC_SANITY_PROJECT_ID >> .env.production
        - env | grep -e NEXT_PUBLIC_SANITY_DATASET >> .env.production
        - env | grep -e SANITY_REVALIDATE_SECRET >> .env.production
        - env | grep -e SANITY_API_TOKEN >> .env.production
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*